name: MVP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
  neo4j:
    runs-on: ubuntu-latest
    services:
      graph:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/graphanatomy-ephemeral-ci
          NEO4J_server_memory_heap_max__size: 512m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graphanatomy-ephemeral-ci 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 18
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphanatomy-ephemeral-ci
      NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:neo4j
